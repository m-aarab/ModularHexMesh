# Run:
#   python cylindricalMesh.py --config cylindricalMesh.example.toml
# Every key is described in README.md.

[mesh]
# Output (relative paths are resolved from this config file's directory)
output_folder = "./output"
output_filename = "cylinder.vtk"
append_hmax = false

# Geometry
rmax = 300.0
length = 600.0
length_axis = "z" # one of: x, y, z
# axis_start = 300.0 # first node layer; default length/2 centres the mesh on 0
shift = [0.0, 0.0, 0.0]

# Target cell size: sets the angular resolution, the radial layers and dz
mesh_size = 20.0
# h = 12 # optional: 8*h nodes around the circle instead of deriving it from mesh_size

# Cross-section (the defaults are optimal at any resolution; see README "Tuning")
# core_fraction = 0.55 # core half-width / rmax
# core_bulge = 0.134   # outward bow of the core edges; tan(15 deg)/2 gives 120-deg core corners
# nr = 5               # rings - 1 (layers - 1); default gives a radial step close to mesh_size

# Axial discretization: "mesh_size" (default), "fixed_layers" (n_layers) or "fixed_dz" (dz)
axial_mode = "mesh_size"
# n_layers = 30
# dz = 20.0

[fields]
write = false
# n1 = 1.4
# n2 = 1.0
# amax = 0.5
# amin = 0.02
# profile_radius = 1.0
